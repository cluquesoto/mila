<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MILA — Made in Latin America</title>
  <meta name="description" content="MILA is a cultural fashion platform and living archive celebrating Latin American design, designers, and identity.">
  <link rel="canonical" href="https://madeinlatinamerica.com/">
  <link rel="alternate" hreflang="es" href="https://madeinlatinamerica.com/">
  <link rel="alternate" hreflang="x-default" href="https://madeinlatinamerica.com/">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="MILA — Made in Latin America">
  <meta property="og:description" content="MILA is a cultural fashion platform and living archive celebrating Latin American design, designers, and identity.">
  <meta property="og:url" content="https://madeinlatinamerica.com/">
  <meta property="og:image" content="https://madeinlatinamerica.com/assets/logos/hero_crop.jpg">
  <meta property="og:locale" content="es_LA">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:site_name" content="MILA">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MILA — Made in Latin America">
  <meta name="twitter:description" content="MILA is a cultural fashion platform and living archive celebrating Latin American design, designers, and identity.">
  <meta name="twitter:image" content="https://madeinlatinamerica.com/assets/logos/hero_crop.jpg">
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/clover-gradient.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #FFFFFF;
      overflow: hidden;
    }
    .holding {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* `contain` rather than `cover`: the wordmark bounces to the edges of the
       frame, so cropping would clip it. The video's own background is white,
       so the letterboxed area blends invisibly into the page. */
    .holding__video {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    /* Sits behind the video (not behind the page background), so it only shows
       through if the video fails to decode or is blocked entirely. */
    .holding__fallback {
      position: absolute;
      z-index: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: clamp(48px, 12vw, 160px);
      letter-spacing: -0.04em;
      color: #000000;
    }
  </style>
</head>
<body>

  <main class="holding">
    <span class="holding__fallback" aria-hidden="true">mila*</span>
    <video
      class="holding__video"
      src="assets/mila_bounce_loop.mp4"
      poster="assets/mila_bounce_poster.jpg"
      autoplay
      loop
      muted
      playsinline
      disablepictureinpicture
      aria-label="MILA — Made in Latin America">
    </video>
  </main>

</body>
</html>
